<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>תזונה ואימונים</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f4f6fc; --card:#ffffff; --card2:#f1f3fb; --line:#e4e8f4; --line2:#cfd5e8;
    --txt:#1a2040; --mut:#6b7494; --dim:#a0a8c4; --red:#e5484d; --hot:#ff8a1f; --good:#0f9d78;
    --acc:#0f9d78; --acc2:#2bc4a0; --accbg:#e3f7f0; --accbd:#9fe0cb; --glow:#0f9d7826;
    --sh:0 1px 2px #1a20400d,0 6px 18px #1a204010;
  }
  body[data-theme=wo]{--acc:#5b5bf0;--acc2:#8b5cf6;--accbg:#ececff;--accbd:#c3c3fb;--glow:#5b5bf026}
  body[data-theme=wt]{--acc:#1b8fe0;--acc2:#38bdf8;--accbg:#e3f2fd;--accbd:#a9d4f5;--glow:#1b8fe026}
  body[data-theme=ph]{--acc:#e0468a;--acc2:#f78fb3;--accbg:#fde8f1;--accbd:#f5b3d0;--glow:#e0468a26}
  html{scroll-behavior:auto}
  body{color:var(--txt);min-height:100vh;
    background:radial-gradient(900px 380px at 85% -80px,var(--glow),transparent 70%),radial-gradient(700px 320px at 0% 0,#ff8a1f12,transparent 70%),var(--bg);
    background-attachment:fixed;
    font-family:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI","Assistant",system-ui,sans-serif;
    padding:16px 16px calc(112px + env(safe-area-inset-bottom));font-size:15px;line-height:1.35}
  body.wmode{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  .wrap{max-width:760px;margin:0 auto}
  bdi{unicode-bidi:isolate}

  /* bottom nav */
  .nav{position:fixed;z-index:50;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:min(calc(100% - 28px),430px);display:flex;gap:4px;padding:6px;border-radius:24px;
    background:#ffffffe6;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid #ffffffcc;box-shadow:0 10px 30px #1a204026,0 2px 6px #1a20400f}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border:0;border-radius:18px;
    background:none;color:var(--mut);font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:.18s}
  .nav button svg{width:22px;height:22px}
  .nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 14px var(--glow)}

  header{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 2px 14px;margin-bottom:6px}
  .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--acc);margin-bottom:4px;font-weight:700}
  h1{font-family:"Secular One","Rubik",sans-serif;font-size:32px;font-weight:400;letter-spacing:-.01em;line-height:1.1}
  .stat{text-align:left}
  .stat .l{font-size:11px;color:var(--mut);margin-bottom:2px}
  .stat .v{display:flex;align-items:baseline;gap:5px;justify-content:flex-end}
  .stat b{font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:40px;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1}
  .stat span{font-size:13px;color:var(--mut)}

  .bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
  .barrow{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mut);align-items:center;margin-bottom:18px}
  .barrow label{display:flex;align-items:center;gap:6px}

  input,textarea{font-family:inherit;color:var(--txt);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font-size:14px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
  textarea{resize:none}
  input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
  input::placeholder,textarea::placeholder{color:var(--dim)}
  input.num{width:56px;text-align:center;font-variant-numeric:tabular-nums;padding:9px 3px}
  .goal{width:58px;padding:4px 6px;font-size:12px;text-align:center;border-radius:9px}
  .sec-lbl{font-size:12px;color:var(--mut);font-weight:600;display:block;margin:0 2px 7px}
  @media (pointer:coarse){input,textarea,select{font-size:16px!important}}

  .card{border:1px solid var(--line);background:var(--card);border-radius:22px;margin-bottom:14px;transition:.25s;box-shadow:var(--sh)}
  .card.done{border-color:var(--accbd);background:linear-gradient(180deg,var(--accbg),#fff 70%)}
  .chead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
  .cleft{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .ctitle{font-weight:700;font-size:17px}
  .card.done .ctitle{color:var(--acc)}
  .csub{font-size:12px;color:var(--mut);margin-top:2px}

  .chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.18s;padding:0}
  .chk.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 4px 10px var(--glow)}
  .chk svg{display:none;width:15px;height:15px}
  .chk.on svg{display:block}
  .chk.sm{width:24px;height:24px}
  .chk.sm svg{width:13px;height:13px}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
  .chk.pop{animation:pop .35s ease-out}

  .pen{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px;display:flex;flex-shrink:0;border-radius:10px;transition:.15s}
  .pen:hover,.pen.on{color:var(--acc);background:var(--accbg)}
  .pen svg{width:16px;height:16px}

  .mnote{padding:0 16px 12px}
  .mnote input{font-size:13px;padding:8px 11px;background:var(--card2);border-color:transparent}
  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 16px 16px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}}
  .col{position:relative}
  .colh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .colh label{font-size:12px;color:var(--mut);font-weight:600}
  .edit{background:var(--card2);border:1px solid var(--accbd);border-radius:14px;padding:10px}
  .eh{display:flex;gap:6px;font-size:10px;color:var(--dim);padding:0 2px 4px}
  .eh .f{flex:1}.eh .n{width:56px;text-align:center}.eh .x{width:22px}
  .erow{display:flex;gap:6px;margin-bottom:6px}
  .erow input{font-size:13px;padding:8px 9px}
  .del{width:24px;background:none;border:0;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .del:hover{color:var(--red)}
  .del svg{width:16px;height:16px}
  .add{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:14px;border:1.5px dashed var(--line2);background:none;color:var(--mut);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-bottom:8px;transition:.15s}
  .add:hover{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
  .add svg{width:15px;height:15px}
  .fin{width:100%;padding:10px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}

  .cklist{display:flex;flex-direction:column;gap:6px}
  .ckopt{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:.18s}
  .ckopt:active{transform:scale(.985)}
  .ckopt.on{background:var(--accbg);border-color:var(--accbd)}
  .ckopt .t{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ckopt.on .t{font-weight:600;color:var(--acc)}
  .ckopt i{font-style:normal;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;flex-shrink:0;background:var(--card2);padding:2px 7px;border-radius:99px}
  .ckopt.on i{background:#fff}
  .empty{font-size:12px;color:var(--mut)}

  .daynav{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;margin-bottom:14px;box-shadow:var(--sh)}
  .daynav button{width:42px;height:42px;border-radius:14px;border:0;background:var(--card2);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s}
  .daynav button:hover:not(:disabled){background:var(--accbg);color:var(--acc)}
  .daynav button:disabled{opacity:.3;cursor:default}
  .daynav button svg{width:18px;height:18px}
  .dinfo{flex:1;text-align:center}
  .dlbl{font-weight:700;font-size:16px}
  .ddate{font-size:12px;color:var(--mut);margin-top:1px}

  /* ---- workouts ---- */
  .hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:linear-gradient(135deg,#5b5bf0 0%,#8b5cf6 60%,#c26bf0 100%);color:#fff;border-radius:26px;padding:20px 20px;margin-bottom:14px;
    box-shadow:0 14px 30px #5b5bf033}
  .hero:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff1c;top:-90px;left:-60px}
  .hero:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:#ffffff14;bottom:-60px;right:30%}
  .hero>*{position:relative;z-index:1}
  .hero .k{font-size:12px;opacity:.85;font-weight:500;margin-bottom:4px}
  .hero .big{font-family:"Secular One","Rubik",sans-serif;font-size:30px;line-height:1.1;margin-bottom:6px}
  .hero .sm{font-size:13px;opacity:.92}
  .ring{flex-shrink:0;direction:ltr}
  .ring text{font-family:"Secular One","Rubik",sans-serif;fill:#fff;font-size:19px}
  .cyc{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px 10px 14px;margin-bottom:14px;box-shadow:var(--sh)}
  .cyc .t{font-size:13px;color:var(--mut)}
  .cyc .t b{color:var(--txt);font-size:14px}
  .cyc button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:0;background:var(--card2);color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .cyc button:hover{background:var(--accbg);color:var(--acc)}
  .cyc button svg{width:14px;height:14px}
  .weeks{display:flex;gap:8px;margin-bottom:16px}
  .weeks button{flex:1;padding:11px 6px 9px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
  .weeks button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 8px 18px var(--glow)}
  .weeks button i{display:block;font-style:normal;font-size:11px;opacity:.75;margin-top:2px;font-weight:500}
  .weeks button u{display:block;height:4px;border-radius:9px;background:var(--line);margin:7px 8px 0;text-decoration:none;overflow:hidden}
  .weeks button u s{display:block;height:100%;background:var(--acc);border-radius:9px;text-decoration:none}
  .weeks button.on u{background:#ffffff40}
  .weeks button.on u s{background:#fff}

  .cta{width:calc(100% - 32px);margin:0 16px 14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:0;border-radius:16px;
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;box-shadow:0 8px 18px var(--glow);transition:.15s}
  .cta:active{transform:scale(.98)}
  .cta svg{width:18px;height:18px}
  .cta.alt{background:var(--accbg);color:var(--acc);box-shadow:none}

  .exs{padding:0 16px 8px}
  .ex{position:relative;border:1px solid var(--line);background:var(--card2);border-radius:18px;padding:12px;margin-bottom:9px;transition:background .2s,border-color .2s,box-shadow .2s}
  .ex.done{border-color:var(--accbd);background:var(--accbg)}
  .ex.shifting{transition:transform .18s ease}
  .ex.dragging{z-index:20;box-shadow:0 18px 40px #1a204040;border-color:var(--acc);background:#fff;transition:none;opacity:.97}
  body.drag-active{user-select:none;-webkit-user-select:none;cursor:grabbing}
  .exh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .exinfo{flex:1;min-width:0}
  .musc{display:inline-block;font-size:10.5px;font-weight:700;color:var(--acc);background:var(--card);border:1px solid var(--accbd);padding:2px 8px;border-radius:99px;margin-bottom:4px}
  .exname{font-weight:700;font-size:15px}
  .exnote{font-size:12px;color:var(--mut);margin-top:3px}
  .refl{font-size:11.5px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .refl b{font-weight:600;color:var(--txt)}
  .prc{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--hot),#ffb020);padding:2px 8px;border-radius:99px}
  .prc svg{width:10px;height:10px}
  .grip{width:34px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--dim);touch-action:none;cursor:grab;border-radius:10px;flex-shrink:0;user-select:none;-webkit-user-select:none}
  .grip:hover{background:var(--card);color:var(--acc)}
  .grip svg{width:18px;height:18px;pointer-events:none}
  .sets{display:flex;flex-wrap:wrap;gap:7px}
  .set{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px 8px;transition:.2s}
  .set.on{border-color:var(--accbd);background:#fff}
  .set .n{font-size:11px;color:var(--dim);font-weight:700;min-width:12px;text-align:center}
  .set input{width:48px;padding:5px 2px;font-size:13px;text-align:center;border-radius:9px;font-variant-numeric:tabular-nums;background:var(--card2);border-color:transparent}
  .set em{font-style:normal;font-size:10px;color:var(--dim)}
  .exedit{background:var(--card);border:1.5px solid var(--accbd);border-radius:16px;padding:11px;margin-bottom:9px}
  .exedit .r{display:flex;gap:6px;margin-bottom:6px;align-items:center}
  .exedit .r input{font-size:13px;padding:8px 10px;background:var(--card2);border-color:transparent}
  .exedit .lbl{font-size:11px;color:var(--mut);width:40px;flex-shrink:0}
  .logbox{margin-top:6px}
  .logrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:7px}
  .logrow .d{font-size:12px;color:var(--mut);min-width:38px;font-variant-numeric:tabular-nums}
  .logrow .nm{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logrow .m{font-size:11.5px;color:var(--mut);text-align:left}

  /* ---- workout mode ---- */
  .wmhead{position:sticky;top:0;z-index:40;margin:-16px -16px 14px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    background:linear-gradient(135deg,#5b5bf0,#8b5cf6 70%,#b266f0);color:#fff;border-radius:0 0 26px 26px;box-shadow:0 12px 26px #5b5bf033}
  .wmtop{display:flex;align-items:center;gap:10px}
  .wmtop .x{width:38px;height:38px;border-radius:13px;border:0;background:#ffffff26;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .wmtop .x svg{width:18px;height:18px}
  .wmtop .tt{flex:1;min-width:0}
  .wmtop .tt b{display:block;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wmtop .tt span{font-size:12px;opacity:.85}
  .clock{font-family:"Secular One","Rubik",sans-serif;font-size:24px;direction:ltr;font-variant-numeric:tabular-nums;background:#ffffff1f;padding:4px 11px;border-radius:13px}
  .wmbar{height:7px;background:#ffffff30;border-radius:99px;overflow:hidden;margin-top:11px}
  .wmbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
  .wmcnt{display:flex;justify-content:space-between;font-size:11.5px;opacity:.9;margin-top:6px}
  .restsel{display:flex;align-items:center;gap:6px;margin:0 2px 12px;flex-wrap:wrap}
  .restsel>span{font-size:12px;color:var(--mut);font-weight:600;margin-left:2px}
  .restsel button{padding:6px 11px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
  .restsel button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
  .wcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);transition:.25s}
  .wcard.done{border-color:var(--accbd);background:linear-gradient(180deg,var(--accbg),#fff 75%)}
  .wcard .exh{margin-bottom:6px}
  .wcard .exname{font-size:17px}
  .sgh,.sgr{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
  .sgh{font-size:11px;color:var(--dim);text-align:center;margin:8px 0 4px;font-weight:600}
  .sgr{margin-bottom:7px}
  .sgr .n{font-weight:700;color:var(--dim);text-align:center;font-size:14px}
  .sgr input{height:48px;font-size:19px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;border-radius:14px;background:var(--card2);border-color:transparent;padding:0 4px}
  .sgr input:focus{background:#fff}
  .sgr.on input{background:#fff;border-color:var(--accbd)}
  .sgr .chk{width:46px;height:46px;border-radius:15px}
  .sgr .chk svg{width:22px;height:22px}
  .wmfoot{position:fixed;z-index:45;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,#f4f6fcf2 35%);}
  .wmfoot button{display:block;width:100%;max-width:728px;margin:0 auto;padding:15px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    color:#fff;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;box-shadow:0 10px 24px var(--glow)}
  .rest{position:fixed;z-index:46;left:50%;transform:translate(-50%,30px);bottom:calc(84px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),430px);
    background:#1a2040;color:#fff;border-radius:20px;padding:10px 12px 12px;box-shadow:0 14px 32px #1a204055;opacity:0;pointer-events:none;transition:.25s}
  .rest.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .rest.end{background:linear-gradient(135deg,#ff8a1f,#ffb020)}
  .rest .rr{display:flex;align-items:center;gap:10px}
  .rest .rl{font-size:12px;opacity:.8}
  .rest .rt{font-family:"Secular One","Rubik",sans-serif;font-size:28px;direction:ltr;flex:1;text-align:right;font-variant-numeric:tabular-nums}
  .rest button{border:0;border-radius:12px;padding:8px 12px;background:#ffffff26;color:#fff;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer}
  .rest .rb{height:5px;border-radius:9px;background:#ffffff30;margin-top:8px;overflow:hidden}
  .rest .rb i{display:block;height:100%;background:var(--hot);width:100%;transition:width .3s linear}
  .rest.end .rb i{background:#fff}
  .backdrop{position:fixed;inset:0;z-index:60;background:#1a204066;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -14px 40px #1a204044;animation:up .28s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{font-family:"Secular One","Rubik",sans-serif;font-weight:400;font-size:26px;margin-bottom:4px}
  .sheet .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .sgrid div{background:var(--card2);border-radius:18px;padding:12px 14px}

/* ---- data layer: per-key dirty tracking, safe load, refresh on focus ---- */
const clone=o=>JSON.parse(JSON.stringify(o));
function canon(o){
  if(Array.isArray(o)) return "["+o.map(canon).join(",")+"]";
  if(o&&typeof o==="object") return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}";
  return JSON.stringify(o===undefined?null:o);
}
const KEYS={nutrition:()=>N,workouts:()=>W,weights:()=>G,photos:()=>PH};
const base={},srv={};              /* base: local state at last sync; srv: server state last seen */
const WMAPS=["reps","wt","doneSet","doneEx","doneSes"];

function ingestKey(k,raw){
  if(k==="nutrition"){
    N=Object.assign(clone(DEF_N),raw);
    if(!N.options||!Object.keys(N.options).length) N.options=clone(SEED_N);
    if(!N.meals||!N.meals.length) N.meals=clone(DEFAULT_MEALS);
    if(!N.days) N.days={};
    if(!N.mealNotes) N.mealNotes={};
    if(N.picks||N.eaten){
      const t=today();
      if(!N.days[t]) N.days[t]={picks:N.picks||{},eaten:N.eaten||{}};
      delete N.picks; delete N.eaten;
    }
    Object.values(N.days).forEach(rec=>{
      if(!rec.picks) rec.picks={}; if(!rec.eaten) rec.eaten={};
      Object.keys(rec.picks).forEach(x=>{ if(!Array.isArray(rec.picks[x])) rec.picks[x]=rec.picks[x]?[rec.picks[x]]:[]; });
    });
    N.meals.forEach(m=>{ if(!N.options[m.id]) N.options[m.id]={}; m.cols.forEach(c=>{ if(!N.options[m.id][c.id]) N.options[m.id][c.id]=[]; }); });
  }else if(k==="workouts"){
    W=Object.assign(clone(DEF_W),raw);
    if(!W.sessions||!W.sessions.length) W.sessions=clone(SEED_W.sessions);
    if(!W.weeks) W.weeks={};
    for(const w of [1,2,3]){
      if(!W.weeks[w]) W.weeks[w]={};
      WMAPS.forEach(m=>{ if(!W.weeks[w][m]) W.weeks[w][m]={}; });
    }
    if(!W.cycle) W.cycle=1;
    if(!Array.isArray(W.log)) W.log=[];
  }else if(k==="weights"){
    G=Object.assign(clone(DEF_G),raw);
    if(!Array.isArray(G.entries)) G.entries=[];
  }else{
    PH=Object.assign({items:[]},raw);
    if(!Array.isArray(PH.items)) PH.items=[];
  }
  srv[k]=canon(raw); base[k]=canon(KEYS[k]());
}
async function fetchRows(){
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),15000);
  try{
    const r=await fetch(SB_URL+"/rest/v1/app_state?select=key,data&key=in.("+Object.keys(KEYS).map(SK).concat("profiles").join(",")+")",{headers:HDRS,cache:"no-store",signal:ac.signal});
    if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()));
    return await r.json();
  }finally{ clearTimeout(to); }
}
async function load(){
  if(!READY) return;
  try{
    const rows=await fetchRows();
    applyNames(rows);
    for(const k of Object.keys(KEYS)){ const x=rows.find(v=>v.key===SK(k)); ingestKey(k,(x&&x.data)||{}); }
    loadFailed=false; loadErr="";
  }catch(e){
    loadFailed=true; loadErr=e.name==="AbortError"?"הזמן עבר":(e.message||String(e));
    if(!N){ for(const k of Object.keys(KEYS)) ingestKey(k,{}); }
  }
  if(!day) day=today();
  restoreWo();
  render();
}
const dirtyKeys=()=>Object.keys(KEYS).filter(k=>canon(KEYS[k]())!==base[k]);
async function pushKey(k){
  const obj=KEYS[k](), snap=canon(obj);
  const r=await fetch(SB_URL+"/rest/v1/app_state?on_conflict=key",{method:"POST",
    headers:Object.assign({},HDRS,{Prefer:"resolution=merge-duplicates"}),
    body:JSON.stringify({key:SK(k),data:obj,updated_at:new Date().toISOString()})});
  if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()));
  base[k]=snap; srv[k]=snap;
}
let saving=false,again=false,dragging=false;
async function save(){
  clearTimeout(timer);
  if(!READY||!N) return;
  if(loadFailed){ setStatus("אין חיבור לשרת – לא נשמר",true); return; }
  if(saving){ again=true; return; }
  saving=true;
  try{
    do{
      again=false;
      const ks=dirtyKeys(); if(!ks.length) break;
      setStatus("שומר…",false,true);
      await Promise.all(ks.map(pushKey));
      setStatus("נשמר ✓");
    }while(again||dirtyKeys().length);
  }catch(e){
    setStatus("השמירה נכשלה – מנסה שוב עוד רגע",true);
    timer=setTimeout(save,8000);
  }finally{ saving=false; }
}
const soon=()=>{clearTimeout(timer);timer=setTimeout(save,600);};
const isTyping=()=>{const a=document.activeElement;return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"));};

/* pull changes made by the other person; never overwrite unsaved local edits */
async function refresh(){
  if(!READY||!N||loadFailed||saving||dragging||wsum||isTyping()||dirtyKeys().length) return;
  let rows; try{ rows=await fetchRows(); }catch(e){ return; }
  if(!N||saving||dragging||wsum||isTyping()||dirtyKeys().length) return;
  let changed=applyNames(rows);
  for(const k of Object.keys(KEYS)){
    const x=rows.find(v=>v.key===SK(k)), raw=(x&&x.data)||{};
    if(!Object.keys(raw).length){
      /* server row is empty/missing but we hold real data: restore it */
      if(canon(KEYS[k]()).length>200) pushKey(k).catch(()=>{});
      continue;
    }
    if(canon(raw)!==srv[k]){ ingestKey(k,raw); changed=true; }
  }
  if(changed) render();
}

function protein(d){
  const rec=N.days[d]; if(!rec) return 0;
  let t=0;
  for(const m of N.meals){
    if(!rec.eaten[m.id]) continue;
    for(const c of m.cols){
      const chosen=rec.picks[m.id+"."+c.id]||[];
      const list=N.options[m.id]?.[c.id]||[];
      chosen.forEach(id=>{const o=list.find(o=>o.id===id); if(o) t+=Number(o.p)||0;});
    }
  }
  return t;
}

/* ---- workouts: helpers ---- */
const $id=x=>document.getElementById(x);
const pad2=n=>String(n).padStart(2,"0");
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
const nsets=ex=>Math.max(1,Number(ex.sets)||1);
const okW=v=>v!=null&&v!==""&&Number(v)>0&&Number(v)<=500;
const fnum=n=>String(+Number(n).toFixed(2));
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return (h?h+":"+pad2(m):pad2(m))+":"+pad2(s%60);};
const prevWeeks=w=>[((w+1)%3)+1,(w%3)+1];

/* best set (highest weight) from the previous weeks */
function refFor(ex,w){
  for(const pw of prevWeeks(w)){
    const wk=W.weeks[pw]; let best=null;
    for(let s=0;s<nsets(ex);s++){
      const k=ex.id+"_"+s, wt=wk.wt[k], rp=wk.reps[k];
      if(okW(wt)&&(!best||Number(wt)>best.wt)) best={wt:Number(wt),reps:rp==null||rp===""?null:Number(rp),week:pw};
    }
    if(best) return best;
  }
  return null;
}
/* same set number in the previous weeks (for placeholders / autofill) */
function setRef(ex,w,s){
  const k=ex.id+"_"+s;
  for(const pw of prevWeeks(w)){
    const wk=W.weeks[pw], wt=wk.wt[k], rp=wk.reps[k];
    if(okW(wt)||(rp!=null&&rp!=="")) return {wt:okW(wt)?Number(wt):null,reps:rp==null||rp===""?null:Number(rp)};
  }
  return null;
}
/* new personal record: heaviest completed set this week beats every other week */
function isPR(ex,w){
  const cur=W.weeks[w]; let mine=0;
  for(let s=0;s<nsets(ex);s++){const k=ex.id+"_"+s; if(cur.doneSet[k]&&okW(cur.wt[k])) mine=Math.max(mine,Number(cur.wt[k]));}
  if(!mine) return false;
  let other=0;
  for(const ow of [1,2,3]){ if(ow===w) continue; const wk=W.weeks[ow];
    for(let s=0;s<nsets(ex);s++){const k=ex.id+"_"+s; if(okW(wk.wt[k])) other=Math.max(other,Number(wk.wt[k]));} }
  return other>0&&mine>other;
}
function exStats(wk){let tot=0,dn=0;W.sessions.forEach(s=>s.exercises.forEach(e=>{tot++;if(wk.doneEx[e.id])dn++;}));return {tot,dn};}
function sesStats(ses,wk){let st=0,sd=0,ed=0;
  ses.exercises.forEach(e=>{if(wk.doneEx[e.id])ed++;for(let s=0;s<nsets(e);s++){st++;if(wk.doneSet[e.id+"_"+s])sd++;}});
  return {st,sd,et:ses.exercises.length,ed};}
function ring(pct,sz,sw){
  const r=(sz-sw)/2,c=2*Math.PI*r,m=sz/2;
  return '<svg class="ring" width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">'
   +'<circle cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="'+sw+'"/>'
   +'<circle cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" stroke="#fff" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-pct/100)).toFixed(1)+'" transform="rotate(-90 '+m+' '+m+')"/>'
   +'<text x="'+m+'" y="'+(m+7)+'" text-anchor="middle">'+pct+'%</text></svg>';
}

/* a value typed in one week is carried to the later weeks that still follow it (empty or equal to the old value) */
function setVal(w,f,k,val){
  const old=W.weeks[w][f][k];
  if(val===undefined) delete W.weeks[w][f][k]; else W.weeks[w][f][k]=val;
  for(let n=w+1;n<=3;n++){
    const m=W.weeks[n][f], cur=m[k];
    if(cur===undefined||cur===old){ if(val===undefined) delete m[k]; else m[k]=val; } else break;
  }
}

/* ---- drag to reorder exercises (pointer events: works with touch + mouse) ---- */
function startDrag(grip,ev){
  const si=+grip.dataset.grip.split("|")[0];
  const card=grip.closest(".ex"), box=card.parentElement;
  const cards=[...box.querySelectorAll(".ex[data-xi]")];
  const idxs=cards.map(c=>+c.dataset.xi), from=cards.indexOf(card);
  if(from<0||cards.length<2) return;
  const sy0=window.scrollY, startY=ev.clientY;
  const rects=cards.map(c=>{const r=c.getBoundingClientRect();return {top:r.top+sy0,h:r.height};});
  const dh=rects[from].h+9;
  let curY=startY,target=from,raf=0,done=false;
  dragging=true; document.body.classList.add("drag-active");
  card.classList.add("dragging");
  cards.forEach((c,i)=>{if(i!==from)c.classList.add("shifting");});
  try{grip.setPointerCapture(ev.pointerId);}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  function update(){
    const dy=(curY-startY)+(window.scrollY-sy0);
    card.style.transform="translateY("+dy+"px) scale(1.02)";
    const center=rects[from].top+rects[from].h/2+dy;
    let t=0;
    for(let i=0;i<cards.length;i++){ if(i!==from&&rects[i].top+rects[i].h/2<center) t++; }
    target=t;
    cards.forEach((c,i)=>{
      if(i===from) return;
      let sh=0;
      if(target>from&&i>from&&i<=target) sh=-dh;
      else if(target<from&&i>=target&&i<from) sh=dh;
      c.style.transform=sh?"translateY("+sh+"px)":"";
    });
  }
  function loop(){
    if(done) return;
    if(curY<95) window.scrollBy(0,-14); else if(curY>window.innerHeight-95) window.scrollBy(0,14);
    update(); raf=requestAnimationFrame(loop);
  }
  function mv(e){curY=e.clientY;}
  function end(e){
    if(done) return; done=true; cancelAnimationFrame(raf);
    grip.removeEventListener("pointermove",mv);
    grip.removeEventListener("pointerup",end);
    grip.removeEventListener("pointercancel",end);
    dragging=false; document.body.classList.remove("drag-active");
    if(target!==from&&e.type!=="pointercancel"){
      const exs=W.sessions[si].exercises, copy=exs.slice();
      const order=cards.map((_,i)=>i); order.splice(from,1); order.splice(target,0,from);
      order.forEach((orig,k)=>{copy[idxs[k]]=exs[idxs[orig]];});
      W.sessions[si].exercises=copy;
      save();
    }
    render();
  }
  grip.addEventListener("pointermove",mv);
  grip.addEventListener("pointerup",end);
  grip.addEventListener("pointercancel",end);
  loop();
}

function sorted(){return G.entries.slice().sort((a,b)=>a.date<b.date?-1:1);}

function chart(){
  const e=sorted();
  if(e.length<2) return '<div class="chartbox"><div class="empty-msg">צריך לפחות 2 שקילות כדי להציג גרף</div></div>';
  const Wd=Math.max(280,Math.min(window.innerWidth,760)-32-20),H=210,pad={t:26,r:16,b:26,l:40};
  const kg=e.map(x=>x.kg);
  let mn=Math.min(...kg), mx=Math.max(...kg);
  const sp=(mx-mn)||2; mn-=sp*.2; mx+=sp*.2;
  const X=i=>pad.l+(i/(e.length-1))*(Wd-pad.l-pad.r);
  const Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(H-pad.t-pad.b);
  const pts=e.map((x,i)=>X(i).toFixed(1)+","+Y(x.kg).toFixed(1));
  const area=pts.join(" ")+" "+X(e.length-1).toFixed(1)+","+(H-pad.b)+" "+X(0).toFixed(1)+","+(H-pad.b);
  let g='<svg class="chart" width="'+Wd+'" height="'+H+'" viewBox="0 0 '+Wd+' '+H+'">'
   +'<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".28"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>';
  for(let i=0;i<=3;i++){
    const v=mn+(mx-mn)*i/3, y=Y(v);
    g+='<line x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(Wd-pad.r)+'" y2="'+y.toFixed(1)+'" stroke="#e4e8f4" stroke-width="1" stroke-dasharray="3 4"/>'
     +'<text x="'+(pad.l-7)+'" y="'+(y+4).toFixed(1)+'" fill="#a0a8c4" font-size="10.5" text-anchor="end">'+v.toFixed(1)+'</text>';
  }
  g+='<polygon points="'+area+'" fill="url(#ga)"/>'
   +'<polyline points="'+pts.join(" ")+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  e.forEach((x,i)=>{const last=i===e.length-1;
    g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.kg).toFixed(1)+'" r="'+(last?5.5:3.6)+'" fill="#fff" stroke="currentColor" stroke-width="'+(last?3:2)+'"/>';});
  const lx=X(e.length-1), ly=Y(e[e.length-1].kg);
  g+='<text x="'+Math.min(lx,Wd-pad.r-12).toFixed(1)+'" y="'+(ly-12).toFixed(1)+'" fill="currentColor" font-size="12.5" font-weight="700" text-anchor="middle">'+e[e.length-1].kg.toFixed(1)+'</text>';
  const step=Math.ceil(e.length/6);
  e.forEach((x,i)=>{ if(i%step===0||i===e.length-1)
    g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" fill="#a0a8c4" font-size="10.5" text-anchor="middle">'+fmtD(x.date)+'</text>'; });
  g+='</svg>';
  return '<div class="chartbox">'+g+'</div>';
}

   +'<div class="f"><label>תאריך</label><input type="date" id="wd" value="'+today()+'"></div>'
   +'<div class="f"><label>משקל (ק״ג)</label><input type="number" step="0.1" id="wk" placeholder="0.0"></div>'
   +'<button data-wadd="1">הוסף</button></div>'
   +'<div style="font-size:11px;color:var(--mut);margin-top:8px">אפשר לבחור תאריך אחורה אם שכחת לרשום</div></div>';

  h+=chart();

  h+='<label class="sec-lbl">היסטוריה</label>';
  if(!e.length){ h+='<div class="wrow"><div class="empty-msg" style="flex:1">אין שקילות עדיין</div></div>'; return h+'<button class="add" data-backup="1" style="margin-top:14px">הורדת גיבוי של כל הנתונים</button>'; }

  const rev=e.slice().reverse();
  rev.forEach((x,i)=>{
    const prev = rev[i+1];
    const d = prev ? x.kg-prev.kg : null;
    const cls = d===null?"same":(d>0?"up":d<0?"down":"same");
    const txt = d===null?"—":((d>0?"+":"")+d.toFixed(1));
    if(wEdit===x.id){
      h+='<div class="wrow" style="border-color:var(--accbd)">'
       +'<input type="date" data-wed="'+x.id+'|date" value="'+x.date+'" style="flex:1">'
       +'<input type="number" step="0.1" data-wed="'+x.id+'|kg" value="'+x.kg+'">'
       +'<button class="pen on" data-wfin="1">'+I.x+'</button>'
       +'<button class="del" data-wdel="'+x.id+'">'+I.trash+'</button></div>';
    }else{
      h+='<div class="wrow"><span class="d">'+x.date.split("-").reverse().join("/")+'</span>'
       +'<span class="dv '+cls+'">'+txt+'</span>'
       +'<span class="kg">'+x.kg.toFixed(1)+' <span style="font-size:11px;color:var(--dim);font-weight:400">ק״ג</span></span>'
       +'<button class="pen" data-wer="'+x.id+'">'+I.pen+'</button></div>';
    }
  });
  return h+'<button class="add" data-backup="1" style="margin-top:14px">הורדת גיבוי של כל הנתונים</button>';
}

/* ---- progress photos ---- */
const PHB="w2-exercise-videos";               /* existing public storage bucket */
const phUrl=p=>SB_URL+"/storage/v1/object/public/"+PHB+"/"+p;
const POSES=["חזית","צד","גב","אחר"];
function wtNear(d){
  const e=sorted().filter(x=>x.date<=d); return e.length?e[e.length-1].kg:null;
}
function loadImg(file){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("לא ניתן לקרוא את התמונה"));}; im.src=u;});
}
function toBlob(im,max,q){
  const sc=Math.min(1,max/Math.max(im.naturalWidth||im.width,im.naturalHeight||im.height));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round((im.naturalWidth||im.width)*sc)); c.height=Math.max(1,Math.round((im.naturalHeight||im.height)*sc));
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("שגיאה בכיווץ התמונה")),"image/jpeg",q));
}
async function sbUpload(path,blob){
  const r=await fetch(SB_URL+"/storage/v1/object/"+PHB+"/"+path,{method:"POST",
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"image/jpeg","x-upsert":"true"},body:blob});
  if(!r.ok) throw new Error("העלאה נכשלה ("+r.status+")");
}
async function addPhoto(file){
  if(!file||phBusy) return;
  if(loadFailed){ setStatus("אין חיבור לשרת",true); return; }
  phBusy=true; setStatus("מעלה תמונה…",false,true);
  try{
    const im=await loadImg(file), full=await toBlob(im,1400,.82), thumb=await toBlob(im,360,.78);
    const id=uid()+uid(), path="fit/"+CUR+"/"+id+".jpg", tpath="fit/"+CUR+"/"+id+"_t.jpg";
    await sbUpload(path,full); await sbUpload(tpath,thumb);
    PH.items.push({id,date:phDate||today(),pose:phPose,note:phNote.trim(),path,tpath,ts:Date.now()});
    phNote=""; cmpA=cmpB=null;
    await save(); setStatus("התמונה נשמרה ✓");
  }catch(e){ setStatus(e.message||"ההעלאה נכשלה",true); }
  phBusy=false; render();
}
async function delPhoto(id){
  const it=PH.items.find(x=>x.id===id); if(!it) return;
  if(!confirm("למחוק את התמונה?")) return;
  PH.items=PH.items.filter(x=>x.id!==id); phView=null; cmpA=cmpB=null;
  save(); render();
  try{ await fetch(SB_URL+"/storage/v1/object/"+PHB,{method:"DELETE",headers:Object.assign({},HDRS),body:JSON.stringify({prefixes:[it.path,it.tpath]})}); }catch(e){}
}

function bind(){
  const $=s=>document.querySelectorAll(s);
  $("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openMenu=editKey=exEdit=sesEdit=wEdit=null;render();window.scrollTo(0,0);});
  $("[data-week]").forEach(b=>b.onclick=()=>{week=+b.dataset.week;exEdit=sesEdit=null;render();});

  /* nutrition — day navigation */
  $("[data-dnav]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.dnav;
    const next=shift(day,n);
    if(n>0 && next>today()) return;      // never go past today
    day=next; openMenu=editKey=null; render();
  });
  $("[data-dtoday]").forEach(b=>b.onclick=()=>{day=today();openMenu=editKey=null;render();});
  $("[data-hist]").forEach(b=>b.onclick=()=>{showHist=!showHist;render();});
  $("[data-goday]").forEach(b=>b.onclick=()=>{day=b.dataset.goday;showHist=false;render();});

  /* nutrition — per-day marks */
  $("[data-eat]").forEach(b=>b.onclick=()=>{const r=D(day),i=b.dataset.eat;r.eaten[i]=!r.eaten[i];save();render();});
  $("[data-ntoggle]").forEach(b=>b.onclick=()=>{
    const r=D(day);const[k,id]=b.dataset.ntoggle.split("|");
    const arr=r.picks[k]||(r.picks[k]=[]);
    const i=arr.indexOf(id);
    if(i>=0) arr.splice(i,1); else arr.push(id);
    save();render();
  });
  $("[data-ned]").forEach(b=>b.onclick=()=>{editKey=editKey===b.dataset.ned?null:b.dataset.ned;openMenu=null;render();});
  $("[data-fin]").forEach(b=>b.onclick=()=>{editKey=null;save();render();});
  $("[data-nadd]").forEach(b=>b.onclick=()=>{const[m,c]=b.dataset.nadd.split(".");N.options[m][c].push({id:uid(),name:"",p:0});save();render();});
  $("[data-ndel]").forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.ndel.split("|");const[m,c]=k.split(".");
    const rm=N.options[m][c][+i];
    Object.values(N.days).forEach(r=>{
      if(Array.isArray(r.picks[k])){ const j=r.picks[k].indexOf(rm.id); if(j>=0) r.picks[k].splice(j,1); }
    });
    N.options[m][c].splice(+i,1);save();render();});
  $("[data-nopt]").forEach(x=>x.oninput=()=>{const[k,i,f]=x.dataset.nopt.split("|");const[m,c]=k.split(".");
    N.options[m][c][+i][f]=f==="p"?(Number(x.value)||0):x.value;soon();});
  $("[data-nnote]").forEach(x=>x.oninput=()=>{N.mealNotes[x.dataset.nnote]=x.value;soon();});

  /* meals — add / rename / delete */
  $("[data-mealed]").forEach(b=>b.onclick=()=>{
    const k="MEAL:"+b.dataset.mealed;
    editKey=editKey===k?null:k; render();
  });
  $("[data-mealname]").forEach(x=>x.oninput=()=>{
    const m=N.meals.find(m=>m.id===x.dataset.mealname); if(m) m.label=x.value; soon();
  });
  $("[data-mealtime]").forEach(x=>x.oninput=()=>{
    const m=N.meals.find(m=>m.id===x.dataset.mealtime); if(m) m.time=x.value; soon();
  });
  $("[data-mealadd]").forEach(b=>b.onclick=()=>{
    const id=uid();
    N.meals.push({id,label:"ארוחה חדשה",time:"",cols:[{id:"a",label:"אפשרות 1"},{id:"b",label:"אפשרות 2"},{id:"c",label:"אפשרות 3"}]});
    N.options[id]={a:[],b:[],c:[]};
    editKey="MEAL:"+id; save(); render();
  });
  $("[data-mealdel]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.mealdel;
    if(!confirm("למחוק את הארוחה? כל האפשרויות וההיסטוריה שלה יימחקו.")) return;
    N.meals=N.meals.filter(m=>m.id!==id);
    delete N.options[id];
    delete N.mealNotes[id];
    Object.values(N.days).forEach(r=>{
      delete r.eaten[id];
      Object.keys(r.picks).forEach(k=>{ if(k.startsWith(id+".")) delete r.picks[k]; });
    });
    editKey=null; save(); render();
  });

  $("[data-nf]").forEach(x=>x.oninput=()=>{const f=x.dataset.nf;N[f]=f==="goal"?(Number(x.value)||0):x.value;soon();
    if(f==="goal"&&tab==="nut"){const t=protein(day),p=Math.min(100,Math.round(t/(N.goal||1)*100));
      document.querySelector(".bar>i").style.width=p+"%";
      document.querySelector(".barrow span").textContent=p+"% מהיעד";
      document.querySelector(".stat span").textContent="/ "+N.goal+" גר׳";}});

  $("[data-prof]").forEach(b=>b.onclick=()=>switchProfile(b.dataset.prof));
  $("[data-pren]").forEach(b=>b.onclick=renameProfile);
  $("[data-pplus]").forEach(b=>b.onclick=unlockAnother);
  $("[data-pose]").forEach(b=>b.onclick=()=>{phPose=b.dataset.pose;render();});
  const pd=$id("phd"); if(pd) pd.oninput=()=>{phDate=pd.value||today();};
  const pn=$id("phn"); if(pn) pn.oninput=()=>{phNote=pn.value;};
  const pb=$id("phbtn"); if(pb) pb.onclick=()=>{ const f=$id("phfile"); if(f) f.click(); };
  const pf=$id("phfile"); if(pf) pf.onchange=()=>{ const f=pf.files&&pf.files[0]; pf.value=""; addPhoto(f); };
  $("[data-pv]").forEach(b=>b.onclick=()=>{phView=b.dataset.pv;render();});
  $("[data-pvx]").forEach(b=>b.onclick=e=>{ if(e.target.tagName==="IMG") return; phView=null; render(); });
  $("[data-pvdel]").forEach(b=>b.onclick=()=>delPhoto(b.dataset.pvdel));
  $("[data-cmp]").forEach(b=>b.onclick=()=>{showCmp=!showCmp;render();});
  $("[data-cmpa]").forEach(x=>x.onchange=()=>{cmpA=x.value;render();});
  $("[data-cmpb]").forEach(x=>x.onchange=()=>{cmpB=x.value;render();});
  $("[data-backup]").forEach(b=>b.onclick=downloadBackup);
  $("[data-copyprev]").forEach(b=>b.onclick=()=>{
    const prev=N.days[shift(day,-1)]; if(!prev) return; const r=D(day);
    Object.keys(prev.picks||{}).forEach(k=>{ if(prev.picks[k]&&prev.picks[k].length) r.picks[k]=prev.picks[k].slice(); });
    save(); render(); setStatus("הועתק מאתמול ✓");});
  $("[data-retry]").forEach(b=>b.onclick=()=>{setStatus("מתחבר…",false,true);load();});
  $("[data-log]").forEach(b=>b.onclick=()=>{showLog=!showLog;render();});

  /* workouts — new cycle: clear ONLY the done marks */
  $("[data-cycle]").forEach(b=>b.onclick=()=>{
    if(!confirm("להתחיל מחזור חדש?\n\nכל סימוני ה\"בוצע\" יתאפסו.\nהתרגילים, החזרות והמשקלים יישארו.")) return;
    for(const w of [1,2,3]){
      const wk=W.weeks[w];
      wk.doneSet={}; wk.doneEx={}; wk.doneSes={};
    }
    W.cycle=(W.cycle||1)+1;
    week=1; exEdit=sesEdit=null;
    save(); render();
  });

  /* workout mode */
  $("[data-start]").forEach(b=>b.onclick=()=>startWo(b.dataset.start));
  $("[data-wclose]").forEach(b=>b.onclick=()=>{
    if(!confirm("לצאת ממצב אימון?\nכל מה שסימנתם ורשמתם נשמר.")) return;
    endWo(); render(); window.scrollTo(0,0);
  });
  $("[data-finish]").forEach(b=>b.onclick=()=>{wsum=calcSummary();render();});
  $("[data-wback]").forEach(b=>b.onclick=()=>{wsum=null;render();});
  $("[data-wsave]").forEach(b=>b.onclick=()=>{
    const s=wsum;
    W.log.push({id:uid(),date:today(),ts:Date.now(),cycle:W.cycle,week:wo.week,sid:s.sid,name:s.name,mins:s.mins,sets:s.sets,total:s.total,vol:s.vol,prs:s.prs});
    if(W.log.length>80) W.log=W.log.slice(-80);
    endWo(); tab="wo"; save(); render(); window.scrollTo(0,0);
  });
  $("[data-rest]").forEach(b=>b.onclick=()=>{rest.sec=+b.dataset.rest;lsSet("fit_rest",String(rest.sec));ensureAudio();render();});

  /* done marks */
  $("[data-wses]").forEach(b=>b.onclick=()=>{
    const sid=b.dataset.wses,wk=W.weeks[week],on=!wk.doneSes[sid];
    wk.doneSes[sid]=on;
    const ses=W.sessions.find(s=>s.id===sid);
    ses.exercises.forEach(e=>{wk.doneEx[e.id]=on;for(let s=0;s<nsets(e);s++)wk.doneSet[e.id+"_"+s]=on;});
    if(on) popSel='[data-wses="'+sid+'"]';
    save();render();});
  $("[data-wex]").forEach(b=>b.onclick=()=>{
    const[sid,eid]=b.dataset.wex.split("|"),wk=W.weeks[week],on=!wk.doneEx[eid];
    const ses=W.sessions.find(s=>s.id===sid),ex=ses.exercises.find(e=>e.id===eid);
    for(let s=0;s<nsets(ex);s++)wk.doneSet[eid+"_"+s]=on;
    syncDone(ses,wk,ex);
    if(on) popSel='[data-wex="'+b.dataset.wex+'"]';
    save();render();});
  $("[data-wset]").forEach(b=>b.onclick=()=>{
    const[sid,eid,si]=b.dataset.wset.split("|"),cw=wo?wo.week:week,wk=W.weeks[cw],k=eid+"_"+si,i=+si;
    const ses=W.sessions.find(s=>s.id===sid),ex=ses.exercises.find(e=>e.id===eid);
    wk.doneSet[k]=!wk.doneSet[k];
    if(wk.doneSet[k]){
      /* fill empty fields from last week's same set, else from the previous set */
      const rf=setRef(ex,cw,i),pk=eid+"_"+(i-1);
      if(wk.reps[k]==null){ if(rf&&rf.reps!=null) setVal(cw,"reps",k,rf.reps); else if(i>0&&wk.reps[pk]!=null) setVal(cw,"reps",k,wk.reps[pk]); }
      if(wk.wt[k]==null){ if(rf&&rf.wt!=null) setVal(cw,"wt",k,rf.wt); else if(i>0&&okW(wk.wt[pk])) setVal(cw,"wt",k,wk.wt[pk]); }
      popSel='[data-wset="'+b.dataset.wset+'"]';
    }
    syncDone(ses,wk,ex);
    if(wk.doneSet[k]&&wo){ ensureAudio(); const ss=sesStats(ses,wk); if(ss.sd<ss.st) startRest(); else hideRest(); }
    save();render();});
  $("[data-wv]").forEach(x=>x.oninput=()=>{
    const[f,k]=x.dataset.wv.split("|");
    setVal(wo?wo.week:week,f,k,x.value===""?undefined:Number(x.value));
    soon();});

  /* exercises / sessions editing */
  $("[data-grip]").forEach(g=>{
    g.onpointerdown=e=>{ if(e.pointerType==="mouse"&&e.button!==0) return; e.preventDefault(); startDrag(g,e); };
    g.oncontextmenu=e=>e.preventDefault();
  });
  $("[data-exer]").forEach(b=>b.onclick=()=>{exEdit=exEdit===b.dataset.exer?null:b.dataset.exer;sesEdit=null;render();});
  $("[data-exfin]").forEach(b=>b.onclick=()=>{exEdit=null;save();render();});
  $("[data-ex]").forEach(x=>x.oninput=()=>{const[si,xi,f]=x.dataset.ex.split("|");
    const ex=W.sessions[+si].exercises[+xi];
    ex[f]=f==="sets"?Math.max(1,Math.min(10,Number(x.value)||1)):x.value;soon();});
  $("[data-exadd]").forEach(b=>b.onclick=()=>{const si=+b.dataset.exadd;
    const ne={id:uid(),muscle:"",name:"",sets:3,note:""};
    W.sessions[si].exercises.push(ne);exEdit=ne.id;save();render();});
  $("[data-exdel]").forEach(b=>b.onclick=()=>{const[si,xi]=b.dataset.exdel.split("|");
    const ex=W.sessions[+si].exercises[+xi];
    if(!confirm("למחוק את התרגיל \""+(ex.name||"ללא שם")+"\"?\nגם המשקלים והחזרות שלו בכל השבועות יימחקו.")) return;
    for(const w of[1,2,3]){const wk=W.weeks[w];delete wk.doneEx[ex.id];
      ["doneSet","reps","wt"].forEach(f=>Object.keys(wk[f]).forEach(k=>{if(k.startsWith(ex.id+"_"))delete wk[f][k];}));}
    W.sessions[+si].exercises.splice(+xi,1);exEdit=null;save();render();});
  $("[data-seser]").forEach(b=>b.onclick=()=>{sesEdit=sesEdit===b.dataset.seser?null:b.dataset.seser;exEdit=null;render();});
  $("[data-sesname]").forEach(x=>x.oninput=()=>{W.sessions[+x.dataset.sesname].name=x.value;soon();});
  $("[data-sesadd]").forEach(b=>b.onclick=()=>{const id=uid();
    W.sessions.push({id,name:"אימון חדש",exercises:[]});sesEdit=id;save();render();});
  $("[data-sesdel]").forEach(b=>b.onclick=()=>{const si=+b.dataset.sesdel,ses=W.sessions[si];
    if(!confirm("למחוק את האימון \""+ses.name+"\" עם כל התרגילים שלו?\nגם המשקלים והחזרות יימחקו.")) return;
    for(const w of[1,2,3]){const wk=W.weeks[w];delete wk.doneSes[ses.id];
      ses.exercises.forEach(e=>{delete wk.doneEx[e.id];
        ["doneSet","reps","wt"].forEach(f=>Object.keys(wk[f]).forEach(k=>{if(k.startsWith(e.id+"_"))delete wk[f][k];}));});}
    W.sessions.splice(si,1);sesEdit=null;save();render();});

  /* weight */
  $("[data-wadd]").forEach(b=>b.onclick=()=>{
    const d=document.getElementById("wd").value;
    const v=parseFloat(document.getElementById("wk").value);
    if(!d||isNaN(v)||v<=0){ setStatus("צריך תאריך ומשקל תקינים",true); return; }
    const ex=G.entries.find(x=>x.date===d);
    if(ex) ex.kg=v; else G.entries.push({id:uid(),date:d,kg:v});
    save();render();});
  $("[data-wer]").forEach(b=>b.onclick=()=>{wEdit=b.dataset.wer;render();});
  $("[data-wfin]").forEach(b=>b.onclick=()=>{wEdit=null;save();render();});
  $("[data-wed]").forEach(x=>x.oninput=()=>{const[id,f]=x.dataset.wed.split("|");
    const e=G.entries.find(v=>v.id===id);if(!e)return;
    if(f==="kg"){const v=parseFloat(x.value);if(!isNaN(v))e.kg=v;} else if(x.value) e.date=x.value;
    soon();});
  $("[data-wdel]").forEach(b=>b.onclick=()=>{
    G.entries=G.entries.filter(x=>x.id!==b.dataset.wdel);wEdit=null;save();render();});

  document.onclick=e=>{if(openMenu&&!e.target.closest(".col")){openMenu=null;render();}};
}

/* ---- global wiring ---- */
$id("rplus").onclick=()=>{
  if(rest.iv){ rest.end+=15000; rest.total+=15; tickRest(); }
  else { clearTimeout(rest.hideT); rest.total=15; rest.end=Date.now()+15000; $id("rest").className="rest show"; $id("rlbl").textContent="מנוחה"; rest.iv=setInterval(tickRest,250); tickRest(); }
};
$id("rskip").onclick=hideRest;
setInterval(()=>{const el=$id("elapsed"); if(el&&wo) el.textContent=clock(Date.now()-wo.startedAt);},1000);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){ if(wo) lockScreen(); if(!READY) return; if(loadFailed) load(); else refresh(); }
  else if(N&&!loadFailed&&dirtyKeys().length) save();
});
window.addEventListener("pagehide",()=>{ if(N&&!loadFailed&&dirtyKeys().length) save(); });
window.addEventListener("focus",()=>{ if(!loadFailed) refresh(); });
window.addEventListener("online",()=>{ if(loadFailed) load(); else if(dirtyKeys().length) save(); });
setInterval(()=>{ if(loadFailed) load(); else refresh(); },45000);
initProfile();
</script>
</body>
</html>
